    <div id="root">

        <div class="alhusainia-splash-card">
          <div class="alhusainia-progress-ring" aria-hidden="true">
            <svg viewBox="0 0 64 64" focusable="false">

              <circle class="alhusainia-progress-value" cx="32" cy="32" r="25" />
            </svg>
          </div>
        </div>
      </div>
      <style>
        .alhusainia-splash {
          position: fixed;
          inset: 0;
          background: #0b1d1e;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family:
            "Tajawal",
            system-ui,
            -apple-system,
            sans-serif;
          color: #f0ebe3;
          z-index: 9999;
          overflow: hidden;
        }
        .alhusainia-splash-card {
          display: grid;
          place-items: center;
          width: 56px;
          height: 56px;
        }
        .alhusainia-progress-ring {
          position: relative;
          width: 52px;
          height: 52px;
        }
        .alhusainia-progress-ring svg {
          display: block;
          width: 100%;
          height: 100%;
          transform: rotate(-90deg);
        }
        .alhusainia-progress-track,
        .alhusainia-progress-value {
          fill: none;
          stroke-width: 4;
        }
        .alhusainia-progress-track {
          stroke: rgba(255, 255, 255, 0.12);
        }
        .alhusainia-progress-value {
          stroke: #d4a574;
          stroke-linecap: round;
          stroke-dasharray: 42 158;
          transform-origin: 32px 32px;
          animation: alhusainia-ring 1.25s ease-in-out infinite;
        }
        @keyframes alhusainia-ring {
          0% {
            transform: rotate(0deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .alhusainia-progress-value {
            animation: none;
            stroke-dasharray: 18 182;
          }
        }
      </style>
